name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore RaayaGitDeploy.slnx

      - name: Build
        run: dotnet build RaayaGitDeploy.slnx --configuration Release --no-restore

      # Add test-project steps as each test project gains its first real behavior test.
      # Microsoft Testing Platform returns exit code 8 when a test module contains zero tests.
      - name: Test Infrastructure
        run: dotnet test tests/RaayaGitDeploy.Infrastructure.Tests/RaayaGitDeploy.Infrastructure.Tests.csproj --configuration Release --no-build
